<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Woof Border Collie Demo</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#07100d;color:#f4fff8}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#173b2d 0,#07100d 58%)}
    main{width:min(640px,100%);text-align:center}.eyebrow{color:#8fbea8;letter-spacing:.15em;text-transform:uppercase;font-size:.76rem;font-weight:800}h1{font-size:clamp(2.4rem,9vw,5.8rem);line-height:.9;margin:.25em 0 .18em}p{color:#adc5b9;margin:.5rem auto;max-width:48ch}
    .activate{width:100%;min-height:150px;margin:36px 0 16px;border:1px solid #58df9d;border-radius:28px;background:#31c778;color:#03160c;font:900 clamp(1.5rem,6vw,2.6rem)/1 system-ui;cursor:pointer;box-shadow:0 18px 60px #0c9d5a40;transition:transform .15s,opacity .15s}
    .activate:hover:not(:disabled){transform:translateY(-2px)}.activate:disabled{cursor:wait;opacity:.58}.activate.active{background:#153a2b;color:#75e8ad;box-shadow:none}
    .state{min-height:3.2em;font-weight:700}.good{color:#72e4aa}.bad{color:#ffae8e}.stop{margin-top:12px;border:1px solid #a64848;border-radius:12px;background:#451b1b;color:#ffdede;padding:12px 20px;font:800 1rem system-ui;cursor:pointer}
    nav{margin-top:32px;display:flex;justify-content:center;gap:20px}a{color:#8fbea8;text-underline-offset:4px;font-size:.9rem}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Woof · Border Collie</div>
    <h1>Ready to work.</h1>
    <p>Clear the turn, fruit, and return paths. Activate Woof, then say “apple”, “banana”, or “pear”.</p>
    <button id="activate" class="activate" type="button">ACTIVATE DEMO</button>
    <div id="state" class="state">Checking the stage…</div>
    <button id="stop" class="stop" type="button">STOP NOW</button>
    <nav aria-label="Operator tools"><a href="/debug">Debug console</a><a href="/tests">Mini tests</a></nav>
  </main>
  <script>
    const activate=document.querySelector('#activate'),state=document.querySelector('#state'),stop=document.querySelector('#stop');
    const voiceOrigin=`${location.protocol}//${location.hostname}:8098`;
    const RUN_HISTORY_KEY='collie-demo-run-history-v1',ACTIVE_RUN_KEY='collie-demo-active-run-v1';
    let activating=false,stageReady=false,voiceReady=false,missionBusy=false,listening=false,latestDemo=null,latestVoice=null,activeRunId=sessionStorage.getItem(ACTIVE_RUN_KEY);
    async function getJson(url){const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(response.statusText);return response.json()}
    async function postJson(url){const response=await fetch(url,{method:'POST'}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||data.error||response.statusText);return data}
    function readRuns(){try{return JSON.parse(localStorage.getItem(RUN_HISTORY_KEY)||'[]')}catch{return []}}
    function writeRuns(runs){localStorage.setItem(RUN_HISTORY_KEY,JSON.stringify(runs.slice(0,30)))}
    function compactSnapshot(demo={},voice={}){const mission=demo.mission||{},produce=demo.produce||{};return{at:new Date().toISOString(),stage_ready:Boolean(demo.stage_ready),health:demo.health||{},camera:{fps:demo.camera_fps??null,age_s:demo.frame_age_s??null,error:demo.last_error||null},produce:{detections:(produce.detections||[]).map(item=>({label:item.label,confidence:item.confidence})),error:produce.error||null},mission:{phase:mission.phase||'idle',reason:mission.reason||null,active:Boolean(mission.active),return_home_status:mission.return_home_status||null,return_distance_m:mission.return_distance_m??null,nav2_status:mission.nav2_status||null},voice:{listening:Boolean(voice.listening),mission_busy:Boolean(voice.mission_busy),last_event:voice.last_event||null,last_heard:voice.last_heard||'',last_target:voice.last_target||null,last_error:voice.last_error||null}}}
    function startRun(){const now=new Date().toISOString(),id=`run-${Date.now()}-${Math.random().toString(16).slice(2,8)}`,snapshot=compactSnapshot(latestDemo||{},latestVoice||{}),runs=readRuns();runs.unshift({id,started_at:now,ended_at:null,outcome:'activation_requested',stages:{activation:{first_seen_at:now,last_seen_at:now,samples:1,result:snapshot}},timeline:[{event:'activate_clicked',snapshot}]});writeRuns(runs);activeRunId=id;sessionStorage.setItem(ACTIVE_RUN_KEY,id);return id}
    function updateRun(demo,voice,event=null){if(!activeRunId)return;const runs=readRuns(),record=runs.find(item=>item.id===activeRunId);if(!record)return;const snapshot=compactSnapshot(demo,voice),phase=snapshot.mission.phase||'idle',stage=record.stages[phase]||{first_seen_at:snapshot.at,last_seen_at:snapshot.at,samples:0,result:snapshot};stage.last_seen_at=snapshot.at;stage.samples+=1;stage.result=snapshot;record.stages[phase]=stage;const previous=record.timeline.at(-1);if(event||!previous||previous.snapshot?.mission?.phase!==phase||previous.snapshot?.voice?.last_event!==snapshot.voice.last_event)record.timeline.push({event:event||`phase:${phase}`,snapshot});record.timeline=record.timeline.slice(-60);record.last_snapshot=snapshot;if(snapshot.voice.last_event==='voice_mission_complete_ready'||phase==='success'){record.outcome='complete';record.ended_at=snapshot.at;activeRunId=null;sessionStorage.removeItem(ACTIVE_RUN_KEY)}else if(snapshot.voice.last_event==='voice_mission_failed'||snapshot.voice.last_event==='voice_mission_aborted_ready'||phase==='aborted'){record.outcome='stopped_or_failed';record.ended_at=snapshot.at;activeRunId=null;sessionStorage.removeItem(ACTIVE_RUN_KEY)}writeRuns(runs)}
    function finishRun(outcome,event){if(!activeRunId)return;const runs=readRuns(),record=runs.find(item=>item.id===activeRunId);if(record){const snapshot=compactSnapshot(latestDemo||{},latestVoice||{});record.outcome=outcome;record.ended_at=snapshot.at;record.last_snapshot=snapshot;record.timeline.push({event,snapshot});writeRuns(runs)}activeRunId=null;sessionStorage.removeItem(ACTIVE_RUN_KEY)}
    function render(){
      activate.disabled=activating||missionBusy||listening||!stageReady||!voiceReady;
      activate.classList.toggle('active',listening||missionBusy);
      activate.textContent=activating?'ACTIVATING…':missionBusy?'DEMO RUNNING':listening?'DEMO ACTIVE':'ACTIVATE DEMO';
      if(missionBusy){state.textContent='Woof is running the fruit mission. STOP NOW remains available.';state.className='state good'}
      else if(!stageReady){state.textContent='Stage preflight is not ready. Open Debug for the failing check.';state.className='state bad'}
      else if(!voiceReady){state.textContent='Voice input is not ready. Open Debug for microphone details.';state.className='state bad'}
      else if(listening){state.textContent='Listening. Say apple, banana, or pear.';state.className='state good'}
      else{state.textContent='Stage ready. Activate when the full area is clear.';state.className='state'}
    }
    async function refresh(){
      try{
        const [demo,voice]=await Promise.all([getJson('/api/status'),getJson(`${voiceOrigin}/api/status`)]);latestDemo=demo;latestVoice=voice;
        stageReady=Boolean(demo.stage_ready);voiceReady=Boolean(voice.credential_configured&&voice.input_ready);missionBusy=Boolean(voice.mission_busy);listening=Boolean(voice.listening);render();
        updateRun(demo,voice);
      }catch(error){stageReady=false;voiceReady=false;state.textContent=`Demo services unavailable: ${error.message}`;state.className='state bad';render()}
    }
    activate.onclick=async()=>{if(activating)return;activating=true;startRun();render();try{const voice=await postJson(`${voiceOrigin}/api/listen/start`);latestVoice=voice;listening=Boolean(voice.listening);updateRun(latestDemo||{},voice,'listening_started');state.textContent='Listening. Say apple, banana, or pear.'}catch(error){finishRun('activation_failed',`activation_failed:${error.message}`);state.textContent=error.message;state.className='state bad'}finally{activating=false;await refresh()}};
    stop.onclick=async()=>{stop.disabled=true;state.textContent='Stopping…';try{await Promise.allSettled([postJson('/api/stop'),postJson(`${voiceOrigin}/api/listen/stop`)]);listening=false;missionBusy=false;finishRun('stopped_by_operator','stop_clicked');state.textContent='Stopped. Activate when you are ready again.';state.className='state'}finally{stop.disabled=false;await refresh()}};
    refresh();setInterval(refresh,1000);
  </script>
</body>
</html>
